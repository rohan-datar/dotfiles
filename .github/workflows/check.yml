---
name: Check nix flake
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

'on':
  push:
    paths-ignore:
      - '**/*.md'
      - .github/**
      - home/rdatar/assets/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  check-flake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check
  check-flake-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check

  # Populates the Hetzner Storage Box binary cache that the NixOS hosts
  # substitute from (see modules/nix.nix).
  push-to-cache:
    name: Push ${{ matrix.host }} to binary cache
    if: github.ref == 'refs/heads/main'
    needs: check-flake-linux
    runs-on: ubuntu-latest
    # A wedged runner otherwise burns ~45min before the service reclaims it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host:
          - home-controller
          - home-desktop
          - home-media
          - home-nas
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install signing, netrc, and Storage Box keys
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          STORAGEBOX_SSH_KEY: ${{ secrets.STORAGEBOX_SSH_KEY }}
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          : "${NIX_CACHE_SIGNING_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_SSH_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_NETRC:?is unset or empty in repo secrets}"

          install -m 0600 /dev/null key.private
          install -m 0600 /dev/null storagebox.key
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > key.private
          printf '%s\n' "$STORAGEBOX_SSH_KEY" > storagebox.key
          # Owned by the runner user, still 0600. System curl (as root) reads
          # this fine, but Nix takes a 401 on the same URL in the same second:
          # the process fetching nix-cache-info is the unprivileged client, not
          # the root daemon, so it could not open a root-owned 0600 file and
          # silently sent no credential. Changing the owner rather than the mode
          # fixes that without making the file readable to anyone else — root
          # bypasses permission checks, so the daemon can still read it too.
          sudo install -m 0600 -o "$(id -un)" -g "$(id -gn)" /dev/null /etc/nix-cache-netrc
          printf '%s\n' "$STORAGEBOX_NETRC" \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | sudo tee /etc/nix-cache-netrc > /dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://u630851-sub3.your-storagebox.de
            extra-trusted-public-keys = homelab-1:mrqVIHbzAqQrYiUiih6cBT8d1uXZBt5IB0J9cddhtbE=
            netrc-file = /etc/nix-cache-netrc
            fallback = true
            http-connections = 16

      - name: Check binary cache auth
        run: |
          H=u630851-sub3.your-storagebox.de

          code=$(sudo curl -sS -o /dev/null -w '%{http_code}' \
            --netrc-file /etc/nix-cache-netrc "https://$H/nix-cache-info" || echo 000)
          echo "nix-cache-info -> HTTP $code"

          # Two probes on purpose, because they can disagree and the
          # disagreement is itself the diagnosis: curl tests whether the
          # credential is accepted, `nix store info` tests the code path
          # substitution actually takes. Nix links its OWN libcurl, parses netrc
          # independently of the system curl, and reads config as the daemon —
          # so a green curl proves nothing about whether Nix can use the cache.
          #
          # Run as root via an absolute path: /etc/nix-cache-netrc is 0600 root,
          # the daemon that substitutes is root, and an unprivileged probe would
          # fail to read it and report a misleading 401.
          # Confirm the installer's extra-conf actually landed; a missing
          # netrc-file here would produce the same 401 as a bad password.
          nix config show | grep -E '^(netrc-file|extra-substituters|fallback)' || true

          # Unprivileged on purpose: this is the identity that failed before,
          # so it is the one worth probing.
          if nix store info --store "https://$H" 2>&1 | sed 's/^/  nix: /'; then
            echo "nix -> cache reachable"
          else
            echo "::warning::Nix cannot use the Storage Box cache — this run builds from source"
          fi

          # A cache that 401s degrades into a silent full rebuild rather than a
          # failure, so surface it. Deliberately a warning, not an error:
          # `fallback` means the run is still correct, just slow, and a Hetzner
          # blip should not break CI.
          #
          # NOTE: the sub3 password must avoid whitespace, '#', quotes and
          # backslash. netrc parsing differs by curl build — a '#' that curl
          # 8.21.0 on the NixOS hosts passes through verbatim is treated as a
          # comment delimiter by the runner's curl, which silently yields an
          # EMPTY password and an indistinguishable 401.
          [ "$code" = 200 ] \
            || echo "::warning::curl cannot authenticate to the cache (HTTP $code)"

      - name: Build ${{ matrix.host }}
        run: |
          nix build -L --max-jobs 1 \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Sign into local cache
        run: |
          nix copy --to "file://$PWD/cache?compression=zstd&secret-key=$PWD/key.private" ./result

      - name: Push delta to Storage Box
        run: |
          rsync -a --ignore-existing \
            -e "ssh -p23 -o StrictHostKeyChecking=accept-new -i $PWD/storagebox.key" \
            cache/ u630851-sub2@u630851.your-storagebox.de:./

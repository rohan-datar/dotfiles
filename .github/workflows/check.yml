---
name: Check nix flake
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

'on':
  push:
    paths-ignore:
      - '**/*.md'
      - .github/**
      - home/rdatar/assets/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  check-flake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check
  check-flake-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check

  # Populates the Hetzner Storage Box binary cache that the NixOS hosts
  # substitute from (see modules/nix.nix).
  push-to-cache:
    name: Push ${{ matrix.host }} to binary cache
    if: github.ref == 'refs/heads/main'
    needs: check-flake-linux
    runs-on: ubuntu-latest
    # A wedged runner otherwise burns ~45min before the service reclaims it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host:
          - home-controller
          - home-desktop
          - home-media
          - home-nas
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install signing, netrc, and Storage Box keys
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          STORAGEBOX_SSH_KEY: ${{ secrets.STORAGEBOX_SSH_KEY }}
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          : "${NIX_CACHE_SIGNING_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_SSH_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_NETRC:?is unset or empty in repo secrets}"

          install -m 0600 /dev/null key.private
          install -m 0600 /dev/null storagebox.key
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > key.private
          printf '%s\n' "$STORAGEBOX_SSH_KEY" > storagebox.key
          sudo install -m 0600 -o root -g root /dev/null /etc/nix-cache-netrc
          printf '%s\n' "$STORAGEBOX_NETRC" \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | sudo tee /etc/nix-cache-netrc > /dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://u630851-sub3.your-storagebox.de
            extra-trusted-public-keys = homelab-1:mrqVIHbzAqQrYiUiih6cBT8d1uXZBt5IB0J9cddhtbE=
            netrc-file = /etc/nix-cache-netrc
            fallback = true
            http-connections = 16

      - name: Check binary cache auth
        run: |
          H=u630851-sub3.your-storagebox.de

          code=$(sudo curl -sS -o /dev/null -w '%{http_code}' \
            --netrc-file /etc/nix-cache-netrc "https://$H/nix-cache-info" || echo 000)
          echo "nix-cache-info -> HTTP $code"

          # TEMPORARY DIAGNOSTIC. Nothing here derives from the password: this
          # repo is public, so its Actions logs are public too. The one question
          # worth answering is whether curl sends an Authorization header at
          # all — if it does not, the `machine` line fails to match the
          # requested host and no credential is ever transmitted, which is
          # indistinguishable from a bad password at the HTTP layer.
          if [ "$code" != 200 ]; then
            echo "--- diagnostic ---"
            # `sudo cmd < file` does NOT work: the shell opens the redirect as
            # the unprivileged user before sudo runs. Pipe from `sudo cat`.
            sudo cat /etc/nix-cache-netrc > /tmp/nt.$$
            echo "netrc bytes: $(wc -c < /tmp/nt.$$)"
            echo "netrc lines: $(wc -l < /tmp/nt.$$)"
            echo "machine lines total:       $(tr -d '\r' < /tmp/nt.$$ | grep -c '^[[:space:]]*machine[[:space:]]')"
            echo "machine line matches host: $(tr -d '\r' < /tmp/nt.$$ \
              | grep -c "^[[:space:]]*machine[[:space:]]\+$H[[:space:]]*$")"
            echo "login lines total:         $(tr -d '\r' < /tmp/nt.$$ | grep -c '^[[:space:]]*login[[:space:]]')"
            echo "login line matches sub3:   $(tr -d '\r' < /tmp/nt.$$ \
              | grep -c '^[[:space:]]*login[[:space:]]\+u630851-sub3[[:space:]]*$')"
            echo "password lines total:      $(tr -d '\r' < /tmp/nt.$$ | grep -c '^[[:space:]]*password[[:space:]]')"
            # Catches a sudo prompt or shell noise pasted in ahead of the file.
            echo "first token on line 1:     [$(head -1 /tmp/nt.$$ | awk '{print $1}')]"
            rm -f /tmp/nt.$$

            # Only the username is printed; it is already public in this file.
            # The two booleans below leak one bit each about whitespace, which
            # is worth it to catch the corruption we cannot otherwise see.
            sent=$(sudo curl -sS -v --netrc-file /etc/nix-cache-netrc \
              "https://$H/nix-cache-info" 2>&1 >/dev/null \
              | grep -i '^> authorization: basic' | sed 's/.*Basic //' \
              | tr -d '\r' | base64 -d 2>/dev/null)
            echo "authorization header sent: $([ -n "$sent" ] && echo 1 || echo 0)"
            echo "login curl transmits:      [${sent%%:*}]"
            pw=${sent#*:}
            echo "transmitted pw is empty:   $([ -z "$pw" ] && echo YES || echo no)"
            case "$pw" in
              ' '*|*' ') echo "transmitted pw has edge whitespace: YES" ;;
              *)         echo "transmitted pw has edge whitespace: no" ;;
            esac

            echo "::warning::Storage Box cache unusable (HTTP $code) — this run builds from source"
          fi

      - name: Build ${{ matrix.host }}
        run: |
          nix build -L --max-jobs 1 \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Sign into local cache
        run: |
          nix copy --to "file://$PWD/cache?compression=zstd&secret-key=$PWD/key.private" ./result

      - name: Push delta to Storage Box
        run: |
          rsync -a --ignore-existing \
            -e "ssh -p23 -o StrictHostKeyChecking=accept-new -i $PWD/storagebox.key" \
            cache/ u630851-sub2@u630851.your-storagebox.de:./

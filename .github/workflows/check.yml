---
name: Check nix flake
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

'on':
  push:
    paths-ignore:
      - '**/*.md'
      - .github/**
      - home/rdatar/assets/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  check-flake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check
  check-flake-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check

  # Populates the Hetzner Storage Box binary cache that the NixOS hosts
  # substitute from (see modules/nix.nix).
  push-to-cache:
    name: Push ${{ matrix.host }} to binary cache
    if: github.ref == 'refs/heads/main'
    needs: check-flake-linux
    runs-on: ubuntu-latest
    # A wedged runner otherwise burns ~45min before the service reclaims it.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host:
          - home-controller
          - home-desktop
          - home-media
          - home-nas
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install signing and Storage Box keys
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          STORAGEBOX_SSH_KEY: ${{ secrets.STORAGEBOX_SSH_KEY }}
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          : "${NIX_CACHE_SIGNING_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_SSH_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_NETRC:?is unset or empty in repo secrets}"

          install -m 0600 /dev/null key.private
          install -m 0600 /dev/null storagebox.key
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > key.private
          printf '%s\n' "$STORAGEBOX_SSH_KEY" > storagebox.key

      # Note there is no `netrc-file` here. Setting it is futile: Determinate
      # Nix pins its own (`/nix/var/determinate/netrc`) and that wins, so a
      # netrc-file we name is simply never read — Nix then sends no credential
      # and takes a 401 that looks exactly like a bad password.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://u630851-sub3.your-storagebox.de
            extra-trusted-public-keys = homelab-1:mrqVIHbzAqQrYiUiih6cBT8d1uXZBt5IB0J9cddhtbE=
            fallback = true
            http-connections = 16

      # Append to whatever netrc Nix has actually resolved, rather than telling
      # Nix where to look. Resolving it at runtime means a future change to
      # Determinate's layout cannot silently reintroduce the 401. netrc holds a
      # list of `machine` entries, so appending leaves Determinate's own
      # (FlakeHub) credentials intact, and `tee -a` preserves the file's
      # existing owner and mode.
      - name: Add Storage Box credentials to Nix's netrc
        env:
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          NETRC=$(nix config show netrc-file)
          echo "Nix netrc: $NETRC"
          # Restart the daemon FIRST, before writing. Two facts collide here:
          # the daemon parses netrc at startup and the installer starts it
          # before this step runs, so it must be restarted; but determinate-nixd
          # manages this file and regenerates it on restart, so restarting
          # afterwards silently discards our entry. Restarting first satisfies
          # both — fresh daemon, and our append is the last write.
          for unit in nix-daemon.service determinate-nixd.service; do
            if systemctl is-active --quiet "$unit" 2>/dev/null; then
              sudo systemctl restart "$unit" && echo "restarted $unit"
            fi
          done

          # mkdir -p, not `install -d`: install would reset the mode of a
          # directory Determinate already owns.
          sudo mkdir -p "$(dirname "$NETRC")"
          sudo touch "$NETRC"
          # Force a newline first. If the existing file does not end in one,
          # appending welds our `machine` token onto its last line and corrupts
          # both entries.
          printf '\n' | sudo tee -a "$NETRC" > /dev/null
          printf '%s\n' "$STORAGEBOX_NETRC" \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | sudo tee -a "$NETRC" > /dev/null

          # Confirm the append landed and that the unprivileged Nix client can
          # actually open it. Neither line reveals any credential.
          echo "machine entries now: $(sudo grep -c '^[[:space:]]*machine[[:space:]]' "$NETRC")"
          echo "netrc mode/owner:    $(sudo stat -c '%a %U:%G' "$NETRC")"
          echo "readable by $(id -un)?  $([ -r "$NETRC" ] && echo yes || echo NO)"

      - name: Check binary cache auth
        run: |
          H=u630851-sub3.your-storagebox.de

          # `nix store info` is the probe that matters: it exercises the same
          # code path substitution takes. A curl check is NOT a substitute —
          # Nix links its own libcurl and resolves netrc-file independently, so
          # curl can return 200 on the very same URL that Nix 401s on.
          #
          # Capture the output rather than piping into sed: `if cmd | sed` tests
          # sed's exit status, which is always 0, and cheerfully reports success
          # on a failed probe.
          echo "nix netrc-file: $(nix config show netrc-file)"
          if out=$(nix store info --store "https://$H" 2>&1); then
            printf '%s\n' "$out" | sed 's/^/  nix: /'
            echo "nix -> cache reachable"
          else
            printf '%s\n' "$out" | sed 's/^/  nix: /'
            echo "::warning::Nix cannot use the Storage Box cache — this run builds from source"
          fi

          # Warning rather than failure on purpose: `fallback` means the run is
          # still correct, just slow, and a Hetzner blip should not break CI.
          #
          # NOTE: the sub3 password must avoid whitespace, '#', quotes and
          # backslash. netrc parsing differs by curl build — a '#' that curl
          # 8.21.0 on the NixOS hosts passes through verbatim is treated as a
          # comment delimiter by other builds, which silently yields an EMPTY
          # password and a 401 indistinguishable from a wrong one.

      - name: Build ${{ matrix.host }}
        run: |
          nix build -L --max-jobs 1 \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - name: Sign into local cache
        run: |
          nix copy --to "file://$PWD/cache?compression=zstd&secret-key=$PWD/key.private" ./result

      - name: Push delta to Storage Box
        run: |
          rsync -a --ignore-existing \
            -e "ssh -p23 -o StrictHostKeyChecking=accept-new -i $PWD/storagebox.key" \
            cache/ u630851-sub2@u630851.your-storagebox.de:./

---
name: Check nix flake
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: push-to-cache exists to publish artefacts, and killing
  # it mid-flight leaves the cache half-populated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

'on':
  push:
    paths-ignore:
      - '**/*.md'
      - .github/**
      - home/rdatar/assets/**
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  check-flake-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check
  check-flake-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix -Lv flake check

  # Populates the Hetzner Storage Box binary cache that the NixOS hosts
  # substitute from (see modules/nix.nix).
  push-to-cache:
    name: Push ${{ matrix.host }} to binary cache
    if: github.event_name == 'workflow_call' || github.ref == 'refs/heads/main'
    needs: check-flake-linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One host failing to build should not hide whether the others made it.
      fail-fast: false
      matrix:
        host:
          - home-controller
          - home-desktop
          - home-media
          - home-nas
    steps:
      # A NixOS closure plus its zstd `file://` copy does not fit in the ~14 GB
      # a stock runner has free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Install signing, netrc, and Storage Box keys
        env:
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          STORAGEBOX_SSH_KEY: ${{ secrets.STORAGEBOX_SSH_KEY }}
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          # An unset secret expands to the empty string and would otherwise
          # degrade silently into a full rebuild.
          : "${NIX_CACHE_SIGNING_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_SSH_KEY:?is unset or empty in repo secrets}"
          : "${STORAGEBOX_NETRC:?is unset or empty in repo secrets}"

          install -m 0600 /dev/null key.private
          install -m 0600 /dev/null storagebox.key
          # No trailing newline: Nix base64-decodes the key file verbatim.
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > key.private
          # OpenSSH does require the trailing newline.
          printf '%s\n' "$STORAGEBOX_SSH_KEY" > storagebox.key

          # Written before Nix is installed so the daemon starts with the
          # credential in place. Owned by the runner user at 0600: root reads it
          # regardless, and the unprivileged client needs it too.
          sudo install -m 0600 -o "$(id -un)" -g "$(id -gn)" /dev/null /etc/nix-cache-netrc
          printf '%s\n' "$STORAGEBOX_NETRC" \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | sudo tee /etc/nix-cache-netrc > /dev/null

      # Upstream Nix, deliberately not Determinate: Determinate pins its own
      # netrc-file, overrides extra-conf, and regenerates that file on daemon
      # restart, so the credential is either never read or wiped after writing.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://u630851-sub3.your-storagebox.de
            extra-trusted-public-keys = homelab-1:mrqVIHbzAqQrYiUiih6cBT8d1uXZBt5IB0J9cddhtbE=
            netrc-file = /etc/nix-cache-netrc
            fallback = true
            http-connections = 16

      # An unusable cache degrades into a silent full rebuild, so surface it as a
      # warning — `fallback` means the run is still correct, just slow.
      #
      # The sub3 password must avoid whitespace, '#', quotes and backslash:
      # netrc parsing differs by curl build, and some treat '#' as a comment
      # delimiter, silently yielding an empty password and a bare 401.
      - name: Check binary cache auth
        run: |
          H=u630851-sub3.your-storagebox.de
          if out=$(nix store info --store "https://$H" 2>&1); then
            echo "cache reachable"
          else
            printf '%s\n' "$out" | sed 's/^/  nix: /'
            echo "::warning::Storage Box cache unusable — this run builds from source"
          fi

      # --max-jobs 1: home-desktop's closure contains several Apple-font Nerd
      # patches and nvidia-kernel-modules, and building four at once exhausts a
      # 16 GB runner. Substitutions are unaffected by this flag.
      - name: Build ${{ matrix.host }}
        run: |
          nix build -L --max-jobs 1 \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      # Sign at copy time; post-build signing hooks leave paths unsigned in the
      # destination, and an unsigned path is silently useless to the hosts.
      - name: Sign into local cache
        run: |
          nix copy --to "file://$PWD/cache?compression=zstd&secret-key=$PWD/key.private" ./result

      # sub2 is the read-write account and exists only for this step; the hosts
      # read the same directory through the read-only sub3. Cache entries are
      # content-addressed, so --ignore-existing uploads just the delta.
      - name: Push delta to Storage Box
        run: |
          rsync -a --ignore-existing \
            -e "ssh -p23 -o StrictHostKeyChecking=accept-new -i $PWD/storagebox.key" \
            cache/ u630851-sub2@u630851.your-storagebox.de:./

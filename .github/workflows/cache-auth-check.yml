---
# Debug harness for the Storage Box binary cache credential path.
#
# Reproduces ONLY the netrc + substituter setup from check.yml's push-to-cache
# job and then probes — no checkout, no matrix, no building. Turnaround is
# ~1 minute instead of the ~25 a full matrix build needs, which matters because
# the failure being chased is intermittent: the same commit has had jobs both
# authenticate and 401 within the same run.
#
# Manual dispatch only. If you change the netrc handling here, mirror it into
# check.yml — the two are duplicated on purpose so this stays standalone.
name: Cache auth check

'on':
  workflow_dispatch: {}

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Four replicas to mirror push-to-cache's concurrency. A lone job probes
    # 5/5 clean, but the real matrix had one host 401 while two others
    # succeeded in the same second — so simultaneous auth against one Hetzner
    # sub-account is the remaining suspect, and one job cannot reproduce it.
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    steps:
      - name: Write netrc before installing Nix
        env:
          STORAGEBOX_NETRC: ${{ secrets.STORAGEBOX_NETRC }}
        run: |
          : "${STORAGEBOX_NETRC:?is unset or empty in repo secrets}"
          sudo install -m 0600 -o "$(id -un)" -g "$(id -gn)" /dev/null /etc/nix-cache-netrc
          printf '%s\n' "$STORAGEBOX_NETRC" \
            | tr -d '\r' \
            | sed '/^[[:space:]]*$/d' \
            | sudo tee /etc/nix-cache-netrc > /dev/null
          echo "netrc: $(stat -c '%a %U:%G %s bytes' /etc/nix-cache-netrc)"

      # Upstream Nix: it honours netrc-file from config. See check.yml for why
      # Determinate's installer could not be made to work here.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://u630851-sub3.your-storagebox.de
            extra-trusted-public-keys = homelab-1:mrqVIHbzAqQrYiUiih6cBT8d1uXZBt5IB0J9cddhtbE=
            netrc-file = /etc/nix-cache-netrc
            fallback = true
            http-connections = 16

      # CAVEAT: `nix store info --store <url>` runs in the CLIENT, which reads
      # netrc itself; `nix build` substitutes through the DAEMON. With the netrc
      # written before install both share one file, so they should now agree —
      # but a green result here still does not fully prove a build will
      # authenticate. Only a real build does.
      - name: Probe the cache
        run: |
          H=u630851-sub3.your-storagebox.de
          pass=0
          fail=0
          for i in 1 2 3 4 5; do
            if out=$(nix store info --store "https://$H" 2>&1); then
              echo "attempt $i: OK"
              pass=$((pass + 1))
            else
              echo "attempt $i: FAIL"
              printf '%s\n' "$out" | grep -iE 'error|401|403|refused' | head -2 | sed 's/^/    /'
              fail=$((fail + 1))
            fi
            sleep 3
          done
          echo "----"
          echo "passed $pass / failed $fail"
          [ "$fail" -eq 0 ] || echo "::warning::cache auth is intermittent or broken ($fail/5 failed)"
